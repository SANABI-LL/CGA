# Clean up PR preview deployments when a PR is closed (merged or abandoned)
name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]

env:
  AWS_REGION: us-east-1
  S3_BUCKET_STAGING: campusgeo-frontend-staging-${{ secrets.AWS_ACCOUNT_ID }}

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    name: Remove preview from S3
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete PR prefix
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Cleaning up preview for PR #${PR_NUMBER}..."
          aws s3 rm "s3://${{ env.S3_BUCKET_STAGING }}/pr-${PR_NUMBER}/" --recursive
          echo "Done."
