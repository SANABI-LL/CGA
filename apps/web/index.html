<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/phoenix.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CampusGeo — University of Chicago AI Geospatial Agent" />
    <!-- CSP: script sources restricted to self + ArcGIS SDK. wasm-unsafe-eval,
         blob workers, and *.arcgis.com connects are required by @arcgis/core;
         ws://localhost:5173 keeps Vite HMR working in dev. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://js.arcgis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://js.arcgis.com; font-src 'self' data: https://fonts.gstatic.com https://js.arcgis.com; img-src 'self' data: blob: https://*.arcgis.com https://*.arcgisonline.com; connect-src 'self' ws://localhost:5173 http://localhost:3001 https://js.arcgis.com https://*.arcgis.com https://*.arcgisonline.com https://*.amazonaws.com https://*.cloudfront.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
    />
    <title>CampusGeo | UChicago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- ArcGIS CSS -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.32/@arcgis/core/assets/esri/themes/dark/main.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
